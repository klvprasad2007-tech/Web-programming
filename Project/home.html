
<!DOCTYPE html>
<html>
<head>

<title>Hall Finder Project</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

/* CARD */

.card{

background:rgba(255,255,255,0.15);
padding:50px;
border-radius:15px;
text-align:center;

backdrop-filter:blur(12px);

box-shadow:0 10px 30px rgba(0,0,0,0.3);

max-width:500px;

}

/* TITLE */

h1{
margin-bottom:10px;
}

/* INFO */

.info{
font-size:18px;
margin:10px 0;
}

/* BUTTON */

button{

margin-top:25px;

padding:14px 30px;

border:none;

border-radius:8px;

background:linear-gradient(45deg,#00c6ff,#0072ff);

color:white;

font-size:16px;

cursor:pointer;

transition:0.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 5px 15px rgba(0,0,0,0.3);

}

</style>

</head>

<body>

<div class="card">

<h1>Hall Finder Booking System</h1>

<p class="info"><b>Name:</b> KLV Prasad</p>

<p class="info"><b>Registration No:</b> 24BCE0347</p>

<p class="info">
A web application for booking event halls, godowns and guest houses.
</p>

<button onclick="openProject()">
View Project
</button>

</div>

<script>

function openProject(){

window.location="index.html";

}

</script>

</body>
</html>
