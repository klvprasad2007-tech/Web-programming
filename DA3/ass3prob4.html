<title>Area of Rectangle</title>

<script>
function calculateArea()
{
var lengthValue = 10;
var widthValue = 5;

var areaResult = lengthValue * widthValue;

var lengthValue = 10.5;
var widthValue = 5.2;

var areaFloatResult = lengthValue * widthValue;

document.getElementById("output").innerHTML =
"Area using integers: " + areaResult +
"<br>Area using floating numbers: " + areaFloatResult;
}
</script>

</head>
<body>

<h1>Area of Rectangle</h1>

<button onclick="calculateArea()">Calculate Area</button>
