<!DOCTYPE html>
<html>
<head>
<title>Grade Calculator</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<style>
body{
font-family:Arial;
background:#eef;
}

.container{
width:300px;
margin:50px auto;
padding:20px;
background:#fff;
border:1px solid #000;
text-align:center;
}

input{
width:90%;
padding:8px;
margin:5px 0;
}

button{
margin-top:10px;
padding:8px 12px;
}

.result{
margin-top:10px;
font-weight:bold;
}
</style>

</head>
<body>

<div id="root"></div>

<script type="text/babel">

function GradeCalculator()
{
const [m1, setM1] = React.useState("");
const [m2, setM2] = React.useState("");
const [m3, setM3] = React.useState("");
const [result, setResult] = React.useState("");

const calculateGrade = () => {

const avg = (Number(m1) + Number(m2) + Number(m3)) / 3;

let grade = "";

if(avg >= 90)
grade = "A";
else if(avg >= 75)
grade = "B";
else if(avg >= 50)
grade = "C";
else
grade = "Fail";

setResult("Average: " + avg.toFixed(2) + " | Grade: " + grade);
};

return (
<div className="container">

<h2>Grade Calculator</h2>

<input type="number" value={m1} onChange={(e)=>setM1(e.target.value)} placeholder="Subject 1" />
<input type="number" value={m2} onChange={(e)=>setM2(e.target.value)} placeholder="Subject 2" />
<input type="number" value={m3} onChange={(e)=>setM3(e.target.value)} placeholder="Subject 3" />

<button onClick={calculateGrade}>Calculate</button>

<div className="result">{result}</div>

<p style={{marginTop:"15px"}}>
Register Number: 24BCE0347 | Name: KLV Prasad
</p>

</div>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GradeCalculator />);

</script>

</body>
</html>
