<!DOCTYPE html>
<html>
<head>
<title>React Image Gallery</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<style>
body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
}

.gallery{
width:500px;
margin:20px auto;
}

.preview{
width:100%;
height:300px;
object-fit:cover;
border:2px solid #000;
margin-bottom:15px;
transition:0.3s;
}

.thumbnails{
display:flex;
justify-content:center;
gap:10px;
}

.thumbnails img{
width:100px;
height:70px;
cursor:pointer;
border:2px solid #ccc;
transition:0.3s;
}

.thumbnails img:hover{
transform:scale(1.1);
border-color:#000;
}
</style>

</head>
<body>

<div id="root"></div>

<script type="text/babel">

function ImageGallery()
{
const images = [
"https://picsum.photos/500/300?1",
"https://picsum.photos/500/300?2",
"https://picsum.photos/500/300?3",
"https://picsum.photos/500/300?4"
];

const [selectedImage, setSelectedImage] = React.useState(images[0]);

return (
<div className="gallery">

<h2>Image Gallery</h2>

<img src={selectedImage} className="preview" />

<div className="thumbnails">
{images.map((img, index) => (
<img
key={index}
src={img}
onClick={() => setSelectedImage(img)}
/>
))}
</div>

<p style={{marginTop:"15px"}}>
Register Number: 24BCE0347 | Name: KLV Prasad
</p>

</div>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ImageGallery />);

</script>

</body>
</html>
